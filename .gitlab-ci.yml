# =============================================================================
# Pipeline CI/CD de GitLab — Deteccion Fitosanitaria AgroScan AI (Grupo 2 - UAO)
# =============================================================================
#
# ARQUITECTURA DE REPOSITORIOS (GitHub <-> GitLab)
#   - Repositorio principal: GitHub (vivacius/uao-gestion-proyectos-ia-deteccion-enfermedades).
#     Aqui vive el codigo, Issues, PRs, Kanban y gobernanza del equipo.
#   - Plataforma de CI/CD y despliegue: GitLab (M4).
#     Ejecuta el Quality Gate (Ruff + Pytest), empaqueta Wheels y distribuciones Docker,
#     publica en GitLab Container Registry y automatiza el despliegue a produccion.
#
# ETAPAS DEL PIPELINE
#   1. quality:
#      - lint      -> Ruff: analisis estatico PEP 8 y formato (~20 s, dependencias dev)
#   2. test:
#      - run_test  -> Pruebas unitarias mediante Makefile con reporte JUnit y cobertura
#   3. build:
#      - package_wheel -> Empaquetado distribuible Wheel y sdist con uv build (dist/)
#      - build_docker  -> Construccion de imagen CPU multi-etapa y push a Container Registry
#   4. deploy:
#      - deploy_vps -> Actualizacion de la VPS por SSH y verificacion HTTPS (SPEC-047)
#                      Solo se crea si DEPLOY_HOST esta configurado como variable protegida.
# =============================================================================

variables:
  # --- Imagen oficial uv -----------------------------------------------------
  UV_VERSION: "0.13.9"
  PYTHON_VERSION: "3.13"
  # Debian 13 (trixie-slim). Requiere transicion t64 para libglib (ver run_test).
  BASE_LAYER: trixie-slim

  # --- Comportamiento determinista de uv --------------------------------------
  # GitLab monta el directorio de build en otro filesystem; copy evita fallos de hard links.
  UV_LINK_MODE: copy
  # Directorio centralizado de cache para acelerar ejecuciones consecutivas.
  UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
  # Respeta uv.lock estrictamente (--frozen); en CI no se resuelven versiones nuevas.
  UV_FROZEN: "1"
  # Falla rapido si se intentara descargar otro interprete Python no fijado.
  UV_PYTHON_DOWNLOADS: never

  # --- Ejecucion y telemetria -------------------------------------------------
  # Salida sin buffer: logs en tiempo real para diagnostico inmediato.
  PYTHONUNBUFFERED: "1"
  # Inyecta opciones a pytest: reporte JUnit para GitLab, cobertura XML y umbral mínimo 85% (M1-03).
  PYTEST_ADDOPTS: "--junitxml=report.xml --cov=src --cov=api --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=85"
  # Clonacion superficial: optimiza tiempos de transferencia del runner.
  GIT_DEPTH: "1"
  # Omitir descarga de pesos SafeTensors en quality (las pruebas unitarias usan mocks).
  GIT_LFS_SKIP_SMUDGE: "1"

# Imagen base compartida
image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER

workflow:
  # Cancela automaticamente pipelines redundantes si llega un commit nuevo a la misma rama.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # No disparar pipeline ante creacion de tags.
    - if: $CI_COMMIT_TAG
      when: never
    # Push a cualquier rama (incluye el espejo desde GitHub).
    - if: $CI_PIPELINE_SOURCE == "push"
    # Pipelines de Merge Request (cuando GitLab MR este habilitado).
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Ejecucion manual (Run pipeline) y programada para verificacion y espejo.
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # Permite validar el pipeline por API sin esperar un push.
    - if: $CI_PIPELINE_SOURCE == "api"

# Etapas secuenciales del pipeline
stages:
  - quality
  - test
  - build
  - deploy

# Configuracion predeterminada para jobs de Python/uv
default:
  timeout: 20 minutes
  interruptible: true
  cache:
    key:
      files:
        - pyproject.toml
        - uv.lock
      prefix: $CI_JOB_NAME
    paths:
      - .uv-cache/

# =============================================================================
# ETAPA 1: QUALITY
# =============================================================================

# Job 1: Calidad estatica de codigo (PEP 8 y formato)
lint:
  stage: quality
  script:
    # Instala solo grupo dev (ruff, pytest) sin empaquetar el proyecto
    - uv sync --only-group dev --no-install-project
    # Ejecuta analisis de linter y verificacion de formateo sin resincronizar
    - uv run --no-sync ruff check .
    - uv run --no-sync ruff format --check .

# =============================================================================
# ETAPA 2: TEST
# =============================================================================

# Job 2: Pruebas unitarias completas y reporte de cobertura.
# Debe completarse antes de cualquier empaquetado o construccion de imagen.
run_test:
  stage: test
  before_script:
    - apt-get update -qq
    - >-
      apt-get install -y -qq --no-install-recommends
      make libgl1 libglib2.0-0t64 libxcb1 libx11-6 libxext6 libsm6 libxrender1
      tk tcl
    - rm -rf /var/lib/apt/lists/*
  script:
    # Sincroniza entorno completo desde uv.lock
    - uv sync
    # Ejecuta suite unitaria mediante el target oficial del Makefile
    - make test-unit
  after_script:
    - uv cache prune --ci
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - report.xml

# =============================================================================
# ETAPA 3: BUILD
# =============================================================================

# Job 3: Construccion de paquetes distribuibles Wheel y sdist (HU-08 / M4)
package_wheel:
  stage: build
  script:
    # Genera distribucion wheel y sdist en dist/
    - uv build
  artifacts:
    name: "dist-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH

# Job 4: Construccion de contenedor CPU y publicacion en GitLab Container Registry
build_docker:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    # Descargar pesos reales: la imagen de produccion debe contener el modelo.
    GIT_LFS_SKIP_SMUDGE: "0"
  before_script:
    # git-lfs permite materializar los pesos si el checkout inicial los omitio.
    - apk add --no-cache git-lfs
    # Login condicional al Container Registry de GitLab si las credenciales existen
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ] && [ -n "$CI_REGISTRY_USER" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      fi
  script:
    # Materializa los objetos LFS y falla si el archivo es solo un puntero.
    - git lfs install --local
    - git lfs pull
    - |
      MODEL_BYTES=$(stat -c%s model.safetensors)
      echo "model.safetensors: ${MODEL_BYTES} bytes"
      if [ "$MODEL_BYTES" -lt 1000000 ]; then
        echo "ERROR: model.safetensors parece un puntero Git LFS y no los pesos reales."
        exit 1
      fi
    # Construye la imagen multi-etapa en CPU con trazabilidad OCI por commit.
    - >-
      docker build
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      --label "org.opencontainers.image.title=agroscan-ai"
      -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    # Politica de publicacion: Solo ramas protegidas (main y develop) suben al Container Registry
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ] && { [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] || [ "$CI_COMMIT_BRANCH" = "develop" ]; }; then
        echo "Publicando imagen oficial en GitLab Container Registry..."
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
        if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
          docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:latest"
          docker push "$CI_REGISTRY_IMAGE:latest"
        fi
      else
        echo "Validacion de build exitosa. Las ramas feature/* no publican al registry para evitar saturacion de imagenes efimeras."
      fi
  rules:
    - if: $CI_COMMIT_BRANCH

# =============================================================================
# ETAPA 4: DEPLOY (SPEC-047)
# =============================================================================

# Job 5: Despliegue automatico a la VPS exclusivamente desde la rama principal (main).
# Requiere variables protegidas: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH,
# SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS, PUBLIC_HOST, LETSENCRYPT_EMAIL,
# DEPLOY_TOKEN_USER y DEPLOY_TOKEN. Sin DEPLOY_HOST el job no se crea.
deploy_vps:
  stage: deploy
  image: alpine:3.20
  timeout: 20 minutes
  interruptible: false
  resource_group: production
  needs:
    - job: build_docker
      artifacts: false
  before_script:
    - apk add --no-cache openssh-client curl
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      set -euo pipefail
      : "${DEPLOY_HOST:?Variable protegida DEPLOY_HOST no configurada}"
      : "${DEPLOY_USER:?Variable protegida DEPLOY_USER no configurada}"
      : "${DEPLOY_PATH:?Variable protegida DEPLOY_PATH no configurada}"
      : "${PUBLIC_HOST:?Variable protegida PUBLIC_HOST no configurada}"
      : "${LETSENCRYPT_EMAIL:?Variable protegida LETSENCRYPT_EMAIL no configurada}"
      : "${DEPLOY_TOKEN_USER:?Variable protegida DEPLOY_TOKEN_USER no configurada}"
      : "${DEPLOY_TOKEN:?Variable protegida DEPLOY_TOKEN no configurada}"

      SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

      echo "Preparando directorio remoto en ${DEPLOY_HOST}..."
      ssh $SSH_OPTS "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${DEPLOY_PATH}/certbot/conf' '${DEPLOY_PATH}/certbot/www'"

      echo "Copiando configuracion de produccion..."
      scp $SSH_OPTS deploy/docker-compose.prod.yml "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/docker-compose.yml"
      scp $SSH_OPTS deploy/nginx.prod.conf.template "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/nginx.prod.conf.template"

      echo "Desplegando commit ${CI_COMMIT_SHA}..."
      ssh $SSH_OPTS "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<REMOTE
      set -euo pipefail
      cd "${DEPLOY_PATH}"

      cat > .env <<ENV
      REGISTRY_IMAGE=${CI_REGISTRY_IMAGE}
      IMAGE_TAG=${CI_COMMIT_SHA}
      DOMAIN=${PUBLIC_HOST}
      MAX_IMAGE_SIZE_MB=10
      ENV

      echo "${DEPLOY_TOKEN}" | docker login "${CI_REGISTRY}" --username "${DEPLOY_TOKEN_USER}" --password-stdin

      if [ ! -f "certbot/conf/live/${PUBLIC_HOST}/fullchain.pem" ]; then
        echo "Certificado no encontrado. Emitiendo certificado inicial con certbot (standalone)..."
        docker compose down --remove-orphans || true
        docker run --rm -p 80:80 \
          -v "${DEPLOY_PATH}/certbot/conf:/etc/letsencrypt" \
          certbot/certbot certonly --standalone --non-interactive --agree-tos \
          --email "${LETSENCRYPT_EMAIL}" -d "${PUBLIC_HOST}"
      fi

      docker compose pull
      docker compose up -d --remove-orphans
      docker compose ps
      REMOTE

      echo "Verificando salud publica por HTTPS..."
      curl --fail --silent --show-error --retry 12 --retry-delay 5 --max-time 10 "https://${PUBLIC_HOST}/health"
      echo ""
      echo "Despliegue verificado: https://${PUBLIC_HOST} (commit ${CI_COMMIT_SHA})"
  environment:
    name: production
    url: https://$PUBLIC_HOST
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_HOST'
      when: on_success
    - when: never
