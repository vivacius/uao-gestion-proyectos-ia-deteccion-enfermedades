# La app de escritorio Tkinter y el frontend web se ejecutan en el host y
# consumen la API publicada en http://127.0.0.1:8000. Este compose solo
# levanta el servicio de inferencia.
services:
  api:
    image: plant-disease-app:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plant-disease-api
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - MODEL_DIR=/app/modelo_plantas
      - MAX_IMAGE_SIZE_MB=10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
