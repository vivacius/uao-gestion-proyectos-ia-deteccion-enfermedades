# =============================================================================
# Espejo GitHub -> GitLab (SPEC-046)
# =============================================================================
# GitHub es la fuente oficial de verdad. Este workflow replica las ramas de
# integracion (develop y main) hacia el proyecto GitLab oficial (89374502).
#
# REQUISITOS DE AUTENTICACION
#   - develop: secreto de repositorio GITLAB_SYNC_TOKEN (o alias GITLAB_TOKEN)
#     con permiso write_repository y rol Developer (30).
#   - main: secreto GITLAB_MAIN_DEPLOY_KEY dentro del GitHub Environment
#     `gitlab-main-mirror` (restringido exclusivamente a `main`), asociado a la
#     Deploy Key SSH `github-main-mirror` autorizada sobre `main` en GitLab.
#
# SEGURIDAD
#   - Los secretos nunca se imprimen ni se escriben en URLs o .git/config.
#   - develop usa GIT_ASKPASS efimero en RUNNER_TEMP y lo elimina al salir.
#   - main usa llave SSH efimera (0600) en RUNNER_TEMP, StrictHostKeyChecking=yes
#     y verificacion explicita de huella Ed25519 de gitlab.com.
#   - No se usa set -x.
#
# SINCRONIZACION
#   - Unidireccional GitHub -> GitLab, solo ramas develop y main.
#   - Estrictamente fast-forward: si la rama de GitLab no es ancestro del
#     commit de GitHub, el job falla y exige intervencion humana. No se
#     reescribe el historial.
# =============================================================================

name: Mirror to GitLab

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-gitlab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror_develop:
    if: github.ref == 'refs/heads/develop'
    name: Mirror develop to GitLab
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout with full history and LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push develop mirror to GitLab (fast-forward only)
        env:
          GITLAB_SYNC_TOKEN: ${{ secrets.GITLAB_SYNC_TOKEN || secrets.GITLAB_TOKEN }}
          GITLAB_REPO: vivacius/uao-gestion-proyectos-ia-deteccion-enfermedades
          SOURCE_BRANCH: develop
        run: |
          set -euo pipefail

          if [ -z "${GITLAB_SYNC_TOKEN:-}" ]; then
            echo "::error title=Espejo no configurado::Falta el secreto GITLAB_SYNC_TOKEN (o el alias GITLAB_TOKEN). Un administrador debe crearlo para habilitar la sincronizacion GitHub -> GitLab."
            exit 1
          fi

          # La URL no contiene credenciales y puede persistir en .git/config sin riesgo.
          git remote add gitlab "https://gitlab.com/${GITLAB_REPO}.git"

          # GIT_ASKPASS efimero: lee el token desde el entorno, nunca lo escribe en disco.
          ASKPASS="${RUNNER_TEMP}/gitlab-askpass.sh"
          cleanup() {
            rm -f "${ASKPASS}"
          }
          trap cleanup EXIT
          cat > "${ASKPASS}" <<'ASKPASS_EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "oauth2" ;;
            *) printf '%s\n' "${GITLAB_SYNC_TOKEN}" ;;
          esac
          ASKPASS_EOF
          chmod 700 "${ASKPASS}"

          export GIT_ASKPASS="${ASKPASS}"
          export GIT_TERMINAL_PROMPT=0
          # Ignora cualquier credential helper persistente durante esta ejecucion.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0=

          LOCAL_SHA="$(git rev-parse HEAD)"
          echo "Origen: ${SOURCE_BRANCH} @ ${LOCAL_SHA}"

          # Preflight: detecta divergencia antes de transferir objetos LFS.
          REMOTE_SHA="$(git ls-remote --heads gitlab "refs/heads/${SOURCE_BRANCH}" | awk '{print $1}')"
          if [ -n "${REMOTE_SHA}" ]; then
            if ! git cat-file -e "${REMOTE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags gitlab "refs/heads/${SOURCE_BRANCH}"
            fi
            if ! git merge-base --is-ancestor "${REMOTE_SHA}" HEAD; then
              echo "::error title=Divergencia de historial::GitLab (${REMOTE_SHA}) no es ancestro de GitHub (${LOCAL_SHA}) en ${SOURCE_BRANCH}. Se requiere intervencion humana; este workflow no reescribe historia."
              exit 1
            fi
          fi

          echo "Subiendo objetos Git LFS..."
          git lfs push --all gitlab

          echo "Replicando rama ${SOURCE_BRANCH} (solo fast-forward)..."
          if ! git push gitlab "HEAD:refs/heads/${SOURCE_BRANCH}"; then
            echo "::error title=Push rechazado::GitLab rechazo el push fast-forward de ${SOURCE_BRANCH}. Revise permisos del token y la proteccion de rama; no se intento reescritura."
            exit 1
          fi

          REMOTE_SHA="$(git ls-remote --heads gitlab "refs/heads/${SOURCE_BRANCH}" | awk '{print $1}')"
          if [ "${REMOTE_SHA}" != "${LOCAL_SHA}" ]; then
            echo "::error title=SHA divergente::GitLab=${REMOTE_SHA} GitHub=${LOCAL_SHA} en ${SOURCE_BRANCH}."
            exit 1
          fi

          {
            echo "### Espejo GitHub -> GitLab"
            echo ""
            echo "| Campo | Valor |"
            echo "| :--- | :--- |"
            echo "| Rama | \`${SOURCE_BRANCH}\` |"
            echo "| SHA | \`${LOCAL_SHA}\` |"
            echo "| Destino | \`${GITLAB_REPO}\` |"
            echo "| Autenticacion | \`GITLAB_SYNC_TOKEN\` (HTTPS) |"
            echo "| Modo | fast-forward, sin reescritura |"
            echo "| Verificacion SHA | OK |"
          } >> "$GITHUB_STEP_SUMMARY"

          unset GITLAB_SYNC_TOKEN

  mirror_main:
    if: github.ref == 'refs/heads/main'
    name: Mirror main to GitLab
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: gitlab-main-mirror

    steps:
      - name: Checkout with full history and LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push main mirror to GitLab via Deploy Key (fast-forward only)
        env:
          GITLAB_MAIN_DEPLOY_KEY: ${{ secrets.GITLAB_MAIN_DEPLOY_KEY }}
          GITLAB_REPO: vivacius/uao-gestion-proyectos-ia-deteccion-enfermedades
          SOURCE_BRANCH: main
          GITLAB_ED25519_FINGERPRINT: SHA256:eUXGGm1YGsMAS7vkcx6JOJdOGHPem5gQp4taiCfCLB8
        run: |
          set -euo pipefail

          if [ -z "${GITLAB_MAIN_DEPLOY_KEY:-}" ]; then
            echo "::error title=Espejo main no configurado::Falta el secreto GITLAB_MAIN_DEPLOY_KEY en el Environment gitlab-main-mirror."
            exit 1
          fi

          SSH_DIR="${RUNNER_TEMP}/gitlab-mirror-ssh"
          KEY_FILE="${SSH_DIR}/id_ed25519"
          KNOWN_HOSTS="${SSH_DIR}/known_hosts"
          cleanup() {
            rm -rf "${SSH_DIR}"
          }
          trap cleanup EXIT

          mkdir -p "${SSH_DIR}"
          chmod 700 "${SSH_DIR}"

          printf '%s\n' "${GITLAB_MAIN_DEPLOY_KEY}" | tr -d '\r' > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          unset GITLAB_MAIN_DEPLOY_KEY

          ssh-keyscan -t ed25519 gitlab.com 2>/dev/null > "${KNOWN_HOSTS}"
          ACTUAL_FP="$(ssh-keygen -lf "${KNOWN_HOSTS}" | awk '{print $2}' | head -n 1)"
          if [ "${ACTUAL_FP}" != "${GITLAB_ED25519_FINGERPRINT}" ]; then
            echo "::error title=Host key invalida::Huella SSH de gitlab.com (${ACTUAL_FP}) no coincide con la esperada (${GITLAB_ED25519_FINGERPRINT})."
            exit 1
          fi
          chmod 644 "${KNOWN_HOSTS}"

          export GIT_SSH_COMMAND="ssh -i ${KEY_FILE} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${KNOWN_HOSTS}"
          export GIT_TERMINAL_PROMPT=0

          git remote add gitlab "git@gitlab.com:${GITLAB_REPO}.git"

          LOCAL_SHA="$(git rev-parse HEAD)"
          echo "Origen: ${SOURCE_BRANCH} @ ${LOCAL_SHA}"

          # Preflight: detecta divergencia antes de transferir objetos LFS.
          REMOTE_SHA="$(git ls-remote --heads gitlab "refs/heads/${SOURCE_BRANCH}" | awk '{print $1}')"
          if [ -n "${REMOTE_SHA}" ]; then
            if ! git cat-file -e "${REMOTE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags gitlab "refs/heads/${SOURCE_BRANCH}"
            fi
            if ! git merge-base --is-ancestor "${REMOTE_SHA}" HEAD; then
              echo "::error title=Divergencia de historial::GitLab (${REMOTE_SHA}) no es ancestro de GitHub (${LOCAL_SHA}) en ${SOURCE_BRANCH}. Se requiere intervencion humana; este workflow no reescribe historia."
              exit 1
            fi
          fi

          echo "Subiendo objetos Git LFS..."
          git lfs push --all gitlab

          echo "Replicando rama ${SOURCE_BRANCH} (solo fast-forward)..."
          if ! git push gitlab "HEAD:refs/heads/${SOURCE_BRANCH}"; then
            echo "::error title=Push rechazado::GitLab rechazo el push fast-forward de ${SOURCE_BRANCH}. Revise la Deploy Key y la proteccion de rama; no se intento reescritura."
            exit 1
          fi

          REMOTE_SHA="$(git ls-remote --heads gitlab "refs/heads/${SOURCE_BRANCH}" | awk '{print $1}')"
          if [ "${REMOTE_SHA}" != "${LOCAL_SHA}" ]; then
            echo "::error title=SHA divergente::GitLab=${REMOTE_SHA} GitHub=${LOCAL_SHA} en ${SOURCE_BRANCH}."
            exit 1
          fi

          {
            echo "### Espejo GitHub -> GitLab"
            echo ""
            echo "| Campo | Valor |"
            echo "| :--- | :--- |"
            echo "| Rama | \`${SOURCE_BRANCH}\` |"
            echo "| SHA | \`${LOCAL_SHA}\` |"
            echo "| Destino | \`${GITLAB_REPO}\` |"
            echo "| Autenticacion | \`GITLAB_MAIN_DEPLOY_KEY\` (SSH Deploy Key) |"
            echo "| Modo | fast-forward, sin reescritura |"
            echo "| Verificacion SHA | OK |"
          } >> "$GITHUB_STEP_SUMMARY"
