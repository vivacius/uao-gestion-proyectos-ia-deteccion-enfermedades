[project]
name = "plant-disease-classifier"
version = "1.0.0"
description = "Aplicación de IA para identificar enfermedades en plantas mediante clasificación de imágenes de hojas con DINOv2-small"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "CC-BY-SA-4.0" }
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "pillow>=11.0.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "requests>=2.32.0",
    "safetensors>=0.4.5",
    "streamlit>=1.40.0",
    "torch>=2.5.0",
    "transformers>=4.46.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pypdf>=6.21.4",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]
markers = [
    "unit: Pruebas unitarias rápidas (pueden utilizar mocks)",
    "integration: Pruebas de integración con el modelo real en CPU",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
